apply plugin: 'com.android.application'
apply from: project(':libaxmol').projectDir.toString() + "/../dsl/axmol.gradle"

// Resolve build profiles
def buildProfiles = AxmolUtils.resolveBuildProfiles(project)

android {
    def packageName = buildProfiles['packageName']
    def cmakeVer = buildProfiles['cmakeVer']
    def cmakeOptions = Eval.me(buildProfiles['cmakeOptions'])
    def minSdk = buildProfiles['minSdk']
    def targetSdk = buildProfiles['targetSdk']

    // Apply build profiles
    namespace = packageName
    compileSdk = targetSdk.toInteger()
    ndkVersion = buildProfiles['ndkVer']
    if(buildProfiles.containsKey('ndkPath')) {
        ndkPath = buildProfiles['ndkPath']
    }

    defaultConfig {
        applicationId packageName
        minSdkVersion minSdk
        targetSdkVersion targetSdk
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments = []
                arguments.addAll(cmakeOptions)
                cppFlags "-frtti -fexceptions -fsigned-char"
            }
        }

        ndk {
            // noinspection ChromeOsAbiSupport
            abiFilters = __1K_ARCHS.split(':').collect{it as String}
        }
    }

    sourceSets.main {
        java.srcDir "src"
        res.srcDir "res"
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDir "build/assets"
    }

    externalNativeBuild {
        cmake {
            version = cmakeVer
            path "../../CMakeLists.txt"
        }
    }

    signingConfigs {
       release {
            if (project.hasProperty("KEY_STORE_FILE")) {
                storeFile file(KEY_STORE_FILE)
                storePassword KEY_STORE_PASSWORD
                keyAlias KEY_ALIAS
                keyPassword KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            proguardFile file(project(':libaxmol').projectDir.toString() + '/proguard-rules.pro')
            if (project.hasProperty("KEY_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            debuggable true
            jniDebuggable true
        }
    }

    // AGP 8+: aaptOptions.noCompress is ignored; use androidResources.
    // Keep aaptOptions for older tooling. Large content.vfs must stay uncompressed.
    aaptOptions {
       noCompress 'mp3','ogg','wav','mp4','ttf','ttc','otf','vfs'
    }
    androidResources {
       noCompress 'mp3','ogg','wav','mp4','ttf','ttc','otf','vfs'
    }

    buildFeatures {
        aidl = true
    }
}

android.applicationVariants.configureEach { variant ->
    def variantName = variant.name.capitalize()
    tasks.register("copy${variantName}ContentToAssets") {
        doFirst {
            delete "${projectDir}/build/assets"
            delete "${projectDir}/build/vfs-staging"
        }
        doLast {
            // CONTENT_VFS_PACK (proj.android/gradle.properties): pack Content into content.vfs + loose native/.
            // Default false = copy the whole Content tree (dev-friendly; no vfstool required).
            def packVfs = (findProperty("CONTENT_VFS_PACK") ?: "false").toString().equalsIgnoreCase("true")
            def repoRoot = file("${projectDir}/../..")
            def contentDir = file("${repoRoot}/Content")

            if (packVfs) {
                exec {
                    workingDir repoRoot
                    commandLine "pwsh", "-File", "${repoRoot}/Tools/pack_content_vfs.ps1"
                }
                def packedVfs = file("${contentDir}/content.vfs")
                if (!packedVfs.exists()) {
                    throw new GradleException("CONTENT_VFS_PACK=true but Content/content.vfs was not produced")
                }
                // IMPORTANT: do NOT put content.vfs under build/assets.
                // AGP compress*Assets uses zipflinger BytesSource (Files.readAllBytes),
                // which throws "Required array size too large" for files >~2GiB even with
                // noCompress 'vfs'. Stage it aside; injectCompressVfsAsset creates the
                // single-entry jar with LargeFileSource after compress*Assets.
                copy {
                    from packedVfs
                    into "${projectDir}/build/vfs-staging"
                }
                // Outside .vfs: Content/native -> assets/native (e.g. video for MediaPlayer file://).
                def nativeDir = file("${contentDir}/native")
                if (nativeDir.exists()) {
                    copy {
                        from nativeDir
                        into "${projectDir}/build/assets/native"
                    }
                }
            } else {
                copy {
                    from contentDir
                    into "${projectDir}/build/assets"
                    exclude "**/*.gz"
                    exclude "content.vfs"
                }
            }
            copy {
                from "${projectDir}/build/runtime/axslc"
                into "${projectDir}/build/assets/axslc"
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':libaxmol')
}

project.afterEvaluate {
    android.applicationVariants.configureEach { variant ->
        def variantName = variant.name.capitalize()
        def copyTask = tasks.named("copy${variantName}ContentToAssets")

        // !!!IMPORTANT: This copy task must depend on the native build task.
        // Without this dependency, the copy step may run before native libraries
        // are built, resulting in incomplete or outdated assets being packaged
        // into the APK. Do not remove or modify this dependency, as it ensures
        // the correct build order: native build -> copy assets -> merge assets -> AAB/APK.
        copyTask.configure {
            dependsOn(tasks.named("externalNativeBuild${variantName}"))
        }

        tasks.named("merge${variantName}Assets").configure {
            dependsOn(copyTask)
        }

        // AGP compress*Assets uses BytesSource (readAllBytes) and dies on >~2GiB files even
        // with noCompress. content.vfs is staged outside assets; append a streamed STORED
        // single-entry jar into this task's output so package* still sees it as COMPRESSED_ASSETS.
        def compressName = "compress${variantName}Assets"
        if (tasks.names.contains(compressName)) {
            tasks.named(compressName).configure {
                dependsOn(copyTask)
                doLast {
                    def packVfs = (findProperty("CONTENT_VFS_PACK") ?: "false").toString().equalsIgnoreCase("true")
                    if (!packVfs) {
                        return
                    }
                    def staged = file("${projectDir}/build/vfs-staging/content.vfs")
                    if (!staged.exists()) {
                        throw new GradleException("Expected staged VFS at ${staged} (CONTENT_VFS_PACK=true)")
                    }
                    def compressOut = outputs.files.singleFile
                    def outJar = new File(compressOut, "assets/content.vfs.jar")
                    outJar.parentFile.mkdirs()
                    def repoRoot = file("${projectDir}/../..")
                    def helperDir = file("${repoRoot}/Tools/make_stored_asset_jar")
                    def zfJar = file("${System.getProperty('user.home')}/.gradle/caches/modules-2/files-2.1/com.android/zipflinger/8.8.1/de8e3267995699af356740cf562cbedb485f5763/zipflinger-8.8.1.jar")
                    if (!zfJar.exists()) {
                        def cacheRoot = file("${System.getProperty('user.home')}/.gradle/caches/modules-2/files-2.1/com.android/zipflinger")
                        def found = null
                        if (cacheRoot.exists()) {
                            cacheRoot.eachFileRecurse { f ->
                                if (found == null && f.name.startsWith("zipflinger-") && f.name.endsWith(".jar") && !f.name.contains("sources") && !f.name.contains("javadoc")) {
                                    found = f
                                }
                            }
                        }
                        if (found == null) {
                            throw new GradleException("zipflinger jar not found under ${cacheRoot}")
                        }
                        zfJar = found
                    }
                    exec {
                        commandLine "java", "-cp", "${helperDir.absolutePath}${File.pathSeparator}${zfJar.absolutePath}",
                                "MakeStoredAssetJar",
                                staged.absolutePath,
                                outJar.absolutePath,
                                "assets/content.vfs"
                    }
                    if (!outJar.exists()) {
                        throw new GradleException("Failed to create ${outJar}")
                    }
                    logger.lifecycle("Injected large STORED asset jar: ${outJar} (${outJar.length()} bytes)")
                }
            }
        }
    }
}


